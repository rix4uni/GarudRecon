# Custom configuration wrapper
# This file sources the base garudrecon.cfg and applies custom overrides
# Set RAM_PROFILE to "max" to use maximum performance settings
RAM_PROFILE="max"

# Source the base configuration file
# Get the directory where this config file is located
CONFIG_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
source "$CONFIG_DIR/garudrecon.cfg"

# Custom overrides - All scan modes set to ADVANCED for maximum coverage
ORG2ASN_SCAN_MODE="ADVANCED"
SPK_SCAN_MODE="ADVANCED"
ANALYTICSRELATIONSHIPS_SCAN_MODE="ADVANCED"
CERTINFO_SCAN_MODE="ADVANCED"
JSUBFINDER_SCAN_MODE="ADVANCED"
PARAMFINDER_SCAN_MODE="ADVANCED"
PATHFINDER_SCAN_MODE="ADVANCED"
VULNTECHX_SCAN_MODE="ADVANCED"
XSS_SCAN_MODE="ADVANCED"
IIS_SCAN_MODE="ADVANCED"
